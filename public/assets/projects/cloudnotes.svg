<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="cnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cnAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="cnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#cnBg)" />

  <g opacity="0.09" stroke="#818cf8" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280 M0,640 H1280" />
    <path d="M160,0 V720 M320,0 V720 M480,0 V720 M640,0 V720 M800,0 V720 M960,0 V720 M1120,0 V720" />
  </g>

  <circle cx="260" cy="540" r="280" fill="#4f46e5" opacity="0.18" filter="blur(80px)" />
  <circle cx="1020" cy="200" r="240" fill="#f472b6" opacity="0.12" filter="blur(80px)" />

  <g transform="translate(140, 70)" filter="url(#cnShadow)">
    <rect width="1000" height="580" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />

    <rect width="1000" height="52" rx="16" fill="#27272a" />
    <rect y="36" width="1000" height="16" fill="#27272a" />
    <circle cx="32" cy="26" r="6" fill="#ef4444" />
    <circle cx="52" cy="26" r="6" fill="#f59e0b" />
    <circle cx="72" cy="26" r="6" fill="#10b981" />
    <text x="500" y="32" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CloudNotes — Collaborative Markdown (React · WebSockets · MongoDB)</text>

    <rect x="0" y="52" width="230" height="528" fill="#131318" />
    <rect x="230" y="52" width="1" height="528" fill="#27272a" />

    <g transform="translate(16, 74)" font-family="system-ui, sans-serif">
      <rect width="198" height="30" rx="6" fill="#1f1f28" stroke="#27272a" />
      <text x="12" y="20" fill="#71717a" font-size="12">⌕  Search notes</text>
    </g>

    <g transform="translate(16, 122)" font-family="system-ui, sans-serif" font-size="12">
      <text x="0" y="0" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1">RECENT</text>

      <rect x="-8" y="14" width="214" height="60" rx="8" fill="#27272a" stroke="#4338ca" />
      <text x="6" y="36" fill="#fafafa" font-weight="600">Sync conflict notes</text>
      <text x="6" y="56" fill="#71717a" font-size="11">edited 2 minutes ago</text>

      <text x="6" y="102" fill="#a1a1aa">Release checklist</text>
      <text x="6" y="120" fill="#52525b" font-size="11">edited yesterday</text>

      <text x="6" y="158" fill="#a1a1aa">Design review notes</text>
      <text x="6" y="176" fill="#52525b" font-size="11">edited 3 days ago</text>

      <text x="6" y="214" fill="#a1a1aa">Onboarding ideas</text>
      <text x="6" y="232" fill="#52525b" font-size="11">edited last week</text>

      <text x="0" y="272" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1">SHARED WITH ME</text>
      <text x="6" y="298" fill="#a1a1aa">API contract v2</text>
      <text x="6" y="316" fill="#52525b" font-size="11">by a teammate</text>
      <text x="6" y="352" fill="#a1a1aa">Roadmap draft</text>
      <text x="6" y="370" fill="#52525b" font-size="11">by a teammate</text>
    </g>

    <g transform="translate(16, 520)">
      <rect width="198" height="40" rx="8" fill="url(#cnAccent)" />
      <text x="99" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ New note</text>
    </g>

    <g transform="translate(262, 82)" font-family="system-ui, sans-serif">
      <text x="0" y="16" fill="#fafafa" font-size="20" font-weight="700">Sync conflict notes</text>
      <text x="0" y="38" fill="#71717a" font-size="12">plain markdown · stored as text</text>

      <g transform="translate(600, 0)">
        <circle cx="0" cy="10" r="12" fill="#4338ca" stroke="#18181b" stroke-width="2" />
        <circle cx="22" cy="10" r="12" fill="#be123c" stroke="#18181b" stroke-width="2" />
        <circle cx="44" cy="10" r="12" fill="#0e7490" stroke="#18181b" stroke-width="2" />
        <rect x="66" y="-2" width="76" height="26" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="104" y="15" fill="#10b981" font-size="11" text-anchor="middle">● 3 online</text>
      </g>

      <g transform="translate(0, 60)">
        <rect width="736" height="1" fill="#27272a" />
      </g>

      <g transform="translate(0, 84)">
        <text x="0" y="0" fill="#818cf8" font-size="16" font-weight="700"># Heading</text>

        <text x="0" y="36" fill="#d4d4d8" font-size="13">Two people editing the same document is where most collaborative</text>
        <text x="0" y="58" fill="#d4d4d8" font-size="13">editors fall over. Last-write-wins silently drops keystrokes,</text>
        <text x="0" y="80" fill="#d4d4d8" font-size="13">and the person who lost the text usually finds out minutes later.</text>

        <text x="0" y="122" fill="#818cf8" font-size="16" font-weight="700">## What we do instead</text>

        <rect x="-8" y="140" width="752" height="80" rx="8" fill="#131318" stroke="#27272a" />
        <text x="8" y="164" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12">doc.apply(op)  →  CRDT merge  →  broadcast(delta)</text>
        <text x="8" y="186" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12">if (conflict) log.append(docId, op, actor)</text>
        <text x="8" y="208" fill="#52525b" font-family="ui-monospace, monospace" font-size="12">// no keystroke is ever discarded</text>

        <g transform="translate(0, 244)">
          <circle cx="8" cy="8" r="8" fill="#10b981" />
          <text x="8" y="12" fill="#10b981" font-size="10" text-anchor="middle">✓</text>
          <text x="28" y="12" fill="#a1a1aa" font-size="13">Presence and cursors share one WebSocket channel per document</text>
        </g>

        <g transform="translate(0, 272)">
          <circle cx="8" cy="8" r="8" fill="#10b981" />
          <text x="8" y="12" fill="#10b981" font-size="10" text-anchor="middle">✓</text>
          <text x="28" y="12" fill="#a1a1aa" font-size="13">Reconnect replays missed deltas instead of resyncing the document</text>
        </g>

        <g transform="translate(0, 300)">
          <circle cx="8" cy="8" r="8" fill="#f59e0b" />
          <text x="8" y="12" fill="#f59e0b" font-size="10" text-anchor="middle">!</text>
          <text x="28" y="12" fill="#a1a1aa" font-size="13">Offline edits queue locally and flush on reconnect</text>
        </g>

        <g transform="translate(0, 344)">
          <rect width="220" height="34" rx="8" fill="#1f1f28" stroke="#27272a" />
          <text x="14" y="22" fill="#a1a1aa" font-size="12">Markdown — insert</text>
          <rect x="228" y="0" width="120" height="34" rx="8" fill="#1f1f28" stroke="#27272a" />
          <text x="242" y="22" fill="#a1a1aa" font-size="12">Share link</text>
          <rect x="356" y="0" width="130" height="34" rx="8" fill="url(#cnAccent)" />
          <text x="421" y="22" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Version history</text>
        </g>
      </g>

      <g transform="translate(0, 528)">
        <text x="0" y="0" fill="#52525b" font-size="11">saved locally · synced just now</text>
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#052e2b" />
    </linearGradient>
    <linearGradient id="ffAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="ffShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#ffBg)" />

  <g opacity="0.09" stroke="#14b8a6" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280 M0,640 H1280" />
    <path d="M160,0 V720 M320,0 V720 M480,0 V720 M640,0 V720 M800,0 V720 M960,0 V720 M1120,0 V720" />
  </g>

  <circle cx="230" cy="200" r="270" fill="#14b8a6" opacity="0.16" filter="blur(80px)" />
  <circle cx="1050" cy="520" r="260" fill="#6366f1" opacity="0.14" filter="blur(80px)" />

  <g transform="translate(140, 70)" filter="url(#ffShadow)">
    <rect width="1000" height="580" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />

    <rect width="1000" height="52" rx="16" fill="#27272a" />
    <rect y="36" width="1000" height="16" fill="#27272a" />
    <circle cx="32" cy="26" r="6" fill="#ef4444" />
    <circle cx="52" cy="26" r="6" fill="#f59e0b" />
    <circle cx="72" cy="26" r="6" fill="#10b981" />
    <text x="500" y="32" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">FormForge — No-Code Form Builder (SvelteKit · Go · PostgreSQL · Docker)</text>

    <rect x="0" y="52" width="200" height="528" fill="#131318" />
    <rect x="200" y="52" width="1" height="528" fill="#27272a" />

    <circle cx="28" cy="86" r="12" fill="url(#ffAccent)" />
    <text x="50" y="91" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FormForge</text>

    <g transform="translate(16, 116)" font-family="system-ui, sans-serif">
      <text x="0" y="0" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1">FIELDS</text>

      <g font-size="12" fill="#a1a1aa">
        <rect x="0" y="14" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="36">▭  Short text</text>

        <rect x="0" y="56" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="78">☰  Long text</text>

        <rect x="0" y="98" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="120">◉  Choice</text>

        <rect x="0" y="140" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="162">▤  File upload</text>

        <rect x="0" y="182" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="204">⑂  Condition</text>

        <rect x="0" y="224" width="168" height="34" rx="6" fill="#1f1f28" stroke="#27272a" />
        <text x="14" y="246">⚡  Webhook</text>
      </g>

      <text x="0" y="300" fill="#52525b" font-size="11" font-weight="700" letter-spacing="1">FORM LOGIC</text>
      <rect x="0" y="314" width="168" height="52" rx="6" fill="#1f1f28" stroke="#27272a" />
      <text x="14" y="336" fill="#a1a1aa" font-size="12">If “plan” is</text>
      <text x="14" y="354" fill="#f4f4f5" font-size="12" font-weight="600">pro → show billing</text>
    </g>

    <g transform="translate(16, 500)">
      <rect width="168" height="34" rx="6" fill="url(#ffAccent)" />
      <text x="84" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Publish form</text>
      <text x="84" y="56" fill="#52525b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">formforge.dev/f/contact</text>
    </g>

    <g transform="translate(228, 76)" font-family="system-ui, sans-serif">
      <text x="0" y="16" fill="#fafafa" font-size="18" font-weight="700">Contact us</text>
      <text x="0" y="36" fill="#71717a" font-size="12">Draft · autosaved</text>

      <rect x="440" y="0" width="60" height="30" rx="6" fill="#1f1f28" stroke="#27272a" />
      <text x="470" y="20" fill="#a1a1aa" font-size="12" text-anchor="middle">⋯</text>
      <rect x="508" y="0" width="70" height="30" rx="6" fill="#1f1f28" stroke="#27272a" />
      <text x="543" y="20" fill="#a1a1aa" font-size="12" text-anchor="middle">v3</text>
      <rect x="586" y="0" width="134" height="30" rx="6" fill="#1f1f28" stroke="#27272a" />
      <text x="653" y="20" fill="#a1a1aa" font-size="12" text-anchor="middle">Preview ↗</text>

      <g transform="translate(0, 56)">
        <rect width="720" height="440" rx="10" fill="#131318" stroke="#27272a" stroke-dasharray="5 5" />

        <g transform="translate(36, 32)">
          <text x="0" y="0" fill="#f4f4f5" font-size="15" font-weight="600">Tell us about your project</text>
          <text x="0" y="22" fill="#71717a" font-size="12">We reply within two working days. Example copy.</text>

          <g transform="translate(0, 48)">
            <text x="0" y="0" fill="#d4d4d8" font-size="12" font-weight="600">Your name</text>
            <rect x="0" y="10" width="640" height="36" rx="6" fill="#1f1f28" stroke="#4338ca" />
            <text x="14" y="33" fill="#71717a" font-size="12">Type here…</text>
          </g>

          <g transform="translate(0, 112)">
            <text x="0" y="0" fill="#d4d4d8" font-size="12" font-weight="600">Email</text>
            <rect x="0" y="10" width="640" height="36" rx="6" fill="#1f1f28" stroke="#27272a" />
            <text x="14" y="33" fill="#52525b" font-size="12">you@company.com</text>
          </g>

          <g transform="translate(0, 176)">
            <text x="0" y="0" fill="#d4d4d8" font-size="12" font-weight="600">Plan</text>
            <g font-size="12">
              <rect x="0" y="10" width="200" height="36" rx="6" fill="#1f1f28" stroke="#14b8a6" />
              <circle cx="20" cy="28" r="6" fill="#14b8a6" />
              <text x="36" y="33" fill="#f4f4f5">Starter</text>

              <rect x="212" y="10" width="200" height="36" rx="6" fill="#1f1f28" stroke="#27272a" />
              <circle cx="232" cy="28" r="6" fill="none" stroke="#52525b" stroke-width="2" />
              <text x="248" y="33" fill="#a1a1aa">Pro</text>

              <rect x="424" y="10" width="216" height="36" rx="6" fill="#1f1f28" stroke="#27272a" />
              <circle cx="444" cy="28" r="6" fill="none" stroke="#52525b" stroke-width="2" />
              <text x="460" y="33" fill="#a1a1aa">Enterprise</text>
            </g>
          </g>

          <g transform="translate(0, 260)">
            <rect x="0" y="0" width="640" height="56" rx="6" fill="#0f2e2c" stroke="#14b8a6" stroke-opacity="0.5" />
            <text x="14" y="24" fill="#5eead4" font-size="12" font-weight="600">⚡ Condition met</text>
            <text x="14" y="42" fill="#0f766e" font-size="11">shows the billing section below</text>
          </g>

          <g transform="translate(0, 330)">
            <text x="0" y="0" fill="#d4d4d8" font-size="12" font-weight="600">Billing reference</text>
            <rect x="0" y="10" width="640" height="36" rx="6" fill="#1f1f28" stroke="#27272a" />
            <text x="14" y="33" fill="#52525b" font-size="12">Visible only when Plan = Pro</text>
          </g>

          <g transform="translate(0, 396)">
            <rect width="120" height="34" rx="6" fill="url(#ffAccent)" />
            <text x="60" y="22" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Submit</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
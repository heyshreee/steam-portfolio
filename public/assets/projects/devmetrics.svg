<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="dmLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="dmBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#dmBg)" />

  <g opacity="0.09" stroke="#22d3ee" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280 M0,640 H1280" />
    <path d="M160,0 V720 M320,0 V720 M480,0 V720 M640,0 V720 M800,0 V720 M960,0 V720 M1120,0 V720" />
  </g>

  <circle cx="220" cy="160" r="270" fill="#22d3ee" opacity="0.15" filter="blur(80px)" />
  <circle cx="1060" cy="560" r="260" fill="#6366f1" opacity="0.16" filter="blur(80px)" />

  <g transform="translate(140, 70)" filter="url(#dmShadow)">
    <rect width="1000" height="580" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />

    <rect width="1000" height="52" rx="16" fill="#27272a" />
    <rect y="36" width="1000" height="16" fill="#27272a" />
    <circle cx="32" cy="26" r="6" fill="#ef4444" />
    <circle cx="52" cy="26" r="6" fill="#f59e0b" />
    <circle cx="72" cy="26" r="6" fill="#10b981" />
    <text x="500" y="32" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">DevMetrics — Engineering Analytics (Next.js · FastAPI · Redis)</text>

    <rect x="0" y="52" width="190" height="528" fill="#131318" />
    <rect x="190" y="52" width="1" height="528" fill="#27272a" />

    <circle cx="28" cy="86" r="12" fill="url(#dmLine)" />
    <text x="50" y="91" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DevMetrics</text>

    <g font-family="system-ui, sans-serif" font-size="12">
      <rect x="14" y="116" width="162" height="30" rx="6" fill="#27272a" />
      <text x="30" y="136" fill="#f4f4f5" font-weight="600">◱  Overview</text>
      <text x="30" y="176" fill="#71717a">⧗  Delivery</text>
      <text x="30" y="206" fill="#71717a">⑂  Code review</text>
      <text x="30" y="236" fill="#71717a">⚙  Pipelines</text>
      <text x="30" y="266" fill="#71717a">⚑  Incidents</text>
    </g>

    <g transform="translate(14, 300)">
      <rect width="162" height="120" rx="8" fill="#1f1f28" stroke="#27272a" />
      <text x="14" y="24" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">RANGE</text>
      <rect x="14" y="36" width="134" height="28" rx="6" fill="#27272a" />
      <text x="28" y="54" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12">Last 30 days</text>
      <rect x="14" y="72" width="134" height="28" rx="6" fill="#27272a" />
      <text x="28" y="90" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12">platform/api</text>
      <text x="14" y="118" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">● pipeline green</text>
    </g>

    <g transform="translate(14, 440)">
      <rect width="162" height="110" rx="8" fill="#1f1f28" stroke="#27272a" />
      <text x="14" y="24" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">EXPORT</text>
      <rect x="14" y="36" width="134" height="28" rx="6" fill="#4338ca" />
      <text x="81" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Download CSV</text>
      <text x="14" y="88" fill="#52525b" font-family="system-ui, sans-serif" font-size="10">idempotent · checkpointed</text>
    </g>

    <g transform="translate(222, 78)" font-family="system-ui, sans-serif">
      <text x="0" y="16" fill="#f4f4f5" font-size="18" font-weight="700">Engineering overview</text>
      <text x="0" y="36" fill="#71717a" font-size="12">Example dashboard — figures are illustrative</text>

      <g transform="translate(0, 56)">
        <rect width="176" height="72" rx="10" fill="#1f1f28" stroke="#27272a" />
        <text x="16" y="26" fill="#71717a" font-size="11">Median PR latency</text>
        <text x="16" y="54" fill="#fafafa" font-size="22" font-weight="700">4h 12m</text>
        <rect x="120" y="30" width="40" height="18" rx="4" fill="#10b981" opacity="0.2" />
        <text x="140" y="43" fill="#10b981" font-size="10" text-anchor="middle">▼ 18%</text>
      </g>

      <g transform="translate(192, 56)">
        <rect width="176" height="72" rx="10" fill="#1f1f28" stroke="#27272a" />
        <text x="16" y="26" fill="#71717a" font-size="11">Deploys / week</text>
        <text x="16" y="54" fill="#fafafa" font-size="22" font-weight="700">37</text>
        <rect x="120" y="30" width="40" height="18" rx="4" fill="#10b981" opacity="0.2" />
        <text x="140" y="43" fill="#10b981" font-size="10" text-anchor="middle">▲ 6%</text>
      </g>

      <g transform="translate(384, 56)">
        <rect width="176" height="72" rx="10" fill="#1f1f28" stroke="#27272a" />
        <text x="16" y="26" fill="#71717a" font-size="11">Flaky test suites</text>
        <text x="16" y="54" fill="#fafafa" font-size="22" font-weight="700">3</text>
        <rect x="120" y="30" width="40" height="18" rx="4" fill="#f59e0b" opacity="0.2" />
        <text x="140" y="43" fill="#f59e0b" font-size="10" text-anchor="middle">= 0%</text>
      </g>

      <g transform="translate(0, 144)">
        <rect width="380" height="240" rx="10" fill="#1f1f28" stroke="#27272a" />
        <text x="18" y="28" fill="#f4f4f5" font-size="13" font-weight="600">Review throughput</text>
        <text x="18" y="46" fill="#71717a" font-size="11">merged pull requests per day</text>

        <g stroke="#3f3f46" stroke-width="1" opacity="0.8">
          <path d="M18,86 H362 M18,126 H362 M18,166 H362 M18,206 H362" />
        </g>

        <polyline points="18,196 62,178 106,186 150,150 194,162 238,124 282,132 326,104 362,112"
                  fill="none" stroke="url(#dmLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <g fill="#22d3ee">
          <circle cx="106" cy="186" r="4" />
          <circle cx="238" cy="124" r="4" />
          <circle cx="362" cy="112" r="4" />
        </g>
        <text x="18" y="228" fill="#52525b" font-size="10">30 days ago</text>
        <text x="362" y="228" fill="#52525b" font-size="10" text-anchor="end">today</text>
      </g>

      <g transform="translate(396, 144)">
        <rect width="164" height="240" rx="10" fill="#1f1f28" stroke="#27272a" />
        <text x="16" y="28" fill="#f4f4f5" font-size="13" font-weight="600">CI queue</text>
        <text x="16" y="46" fill="#71717a" font-size="11">minutes by stage</text>

        <g fill="url(#dmBar)">
          <rect x="24" y="150" width="22" height="66" rx="4" />
          <rect x="56" y="110" width="22" height="106" rx="4" />
          <rect x="88" y="132" width="22" height="84" rx="4" />
          <rect x="120" y="86" width="22" height="130" rx="4" />
        </g>
        <text x="24" y="232" fill="#52525b" font-size="10">build</text>
        <text x="56" y="232" fill="#52525b" font-size="10">test</text>
        <text x="88" y="232" fill="#52525b" font-size="10">lint</text>
        <text x="118" y="232" fill="#52525b" font-size="10">e2e</text>
      </g>
    </g>
  </g>
</svg>
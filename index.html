<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Static defaults for crawlers. These are overwritten at runtime from
      `seo` in src/config/portfolio.ts — edit the config, or edit both.
    -->
    <title>Developer Portfolio Template</title>
    <meta
      name="description"
      content="A modern, responsive developer portfolio template built with React, TypeScript, Vite and Tailwind CSS. Customize one config file and deploy."
    />
    <meta name="author" content="Portfolio Template" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Developer Portfolio Template" />
    <meta
      property="og:description"
      content="A modern, responsive developer portfolio template built with React, TypeScript, Vite and Tailwind CSS."
    />
    <meta property="og:url" content="https://example.com" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Developer Portfolio Template" />
    <meta
      name="twitter:description"
      content="A modern, responsive developer portfolio template built with React, TypeScript, Vite and Tailwind CSS."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-900 text-zinc-50 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
